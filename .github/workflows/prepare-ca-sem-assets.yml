name: Apply Ca SEM manuscript revision
on:
  push:
    paths:
      - '.github/workflows/prepare-ca-sem-assets.yml'
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Insert the verified corrosion morphology description
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          base=Path('Ca/mg-la-ni-ca-ijhe-zh-2026')
          main=base/'project/main.tex'
          data=main.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob=='68490391363938c66688ab152e9a37d4adc29aab', 'Manuscript changed; manual reconciliation required'
          assert (base/'main.tex').read_bytes()==data, 'Mirror differs; do not overwrite'
          s=data.decode()
          s=s.replace('\\usepackage{caption}\n','\\usepackage{caption}\n\\usepackage{placeins}\n',1)
          method='此外，对四种合金在去离子水中浸泡24 h后的表面进行SEM观察，以比较腐蚀后的覆盖结构及局部缺陷。腐蚀表面采用Versa 3D扫描电子显微镜在10 kV加速电压下以二次电子模式观察。展示图根据原始图像标定信息统一物理视场；原始视场较大的图像经中心裁剪后统一显示尺寸，未调整灰度对比度。'
          anchor='\\subsection{储氢性能测试}'
          assert s.count(anchor)==2
          s=s.replace(anchor,method+'\n\n'+anchor,1)
          section=r'''\FloatBarrier
          \subsubsection{浸泡24 h后的表面形貌}

          为补充短时析氢测试，对四种合金在去离子水中浸泡24 h后的表面形貌进行比较。在所示视场内，未添加Ca的合金表面分布有较多不规则的粗大团聚结构，伴随明显的开口状缺陷及沟壑，局部覆盖结构不连续，表面起伏较为突出。加入0.3 wt.\% Ca后，相对连续的覆盖区域增多，但仍可见局部凹陷、沟槽及不规则边缘。0.7Ca合金表面主要表现为较细小的颗粒状起伏，粗大沟壑有所减弱，但局部仍存在开口状缺陷。相比之下，1.4Ca合金表面相对平缓，粗大团聚结构和宽大沟壑较少，以较细小的连通纹理为主，覆盖形貌较为均匀。

          \IfFileExists{figures/figure-02-corrosion-sem.png}{%
          \cafig{figure-02-corrosion-sem.png}{Mg--8La--4Ni--$x$Ca合金在去离子水中浸泡24 h后的表面SEM形貌：（a）$x=0$；（b）$x=0.3$；（c）$x=0.7$；（d）$x=1.4$（Ca含量均为wt.\%）。各子图按原始标定统一至约1.036 mm$\times$0.691 mm的物理视场，比例尺均为200 $\mu$m。}{fig:corrosion-sem}
          }{}

          总体而言，随着Ca添加量增加，所示腐蚀表面的粗大团聚和明显沟壑总体减弱，覆盖形貌趋于连续、均匀，其中1.4Ca样品的变化最为明显。这一形貌趋势与短时析氢测试中含Ca样品具有较低相对析氢水平的结果相互呼应，但两类测试的观察时长不同，不能据此推断24 h内的累计析氢量或腐蚀速率。上述比较属于表面形貌的定性观察，不能将其直接等同于表面粗糙度的单调降低、腐蚀产物膜致密度的提高或保护性增强；腐蚀产物的化学组成及膜层结构仍需进一步表征。
          \FloatBarrier

          '''
          target='\\subsection{储氢性能测试}\n\n\\subsubsection{储氢热力学测试}'
          assert s.count(target)==1
          s=s.replace(target,section+target)
          s=s.replace('然而，当前仅有峰面积衍生的相对指标，且部分区间重复间离散较大；在缺少峰面积--产气量定量标定、腐蚀膜成分、界面电化学及长期浸泡数据的情况下，','然而，析氢数据仍为峰面积衍生的相对指标，且部分区间重复间离散较大；24 h表面SEM仅提供形貌证据。在缺少峰面积--产气量定量标定、腐蚀膜成分、界面电化学及长期腐蚀定量数据的情况下，',1)
          s=s.replace('其三，腐蚀结果仅覆盖63.62 min的去离子水浸泡，','其三，析氢定量比较仅覆盖63.62 min的去离子水浸泡，24 h的补充SEM观察仅反映所示视场的表面形貌，',1)
          main.write_text(s)
          (base/'main.tex').write_text(s)
          log=base/'logs/change_log.md'
          with log.open('a') as f:
              f.write('\n## [2026-10-22] 腐蚀后SEM形貌补充\n- object: 两个main.tex入口；第3.3.2节。\n- action: 在析氢结果后插入24 h腐蚀表面形貌分析，补充SEM方法并更新讨论中的证据范围。\n- status: warning\n- note: 新拼图已在本次对话生成，使用Times New Roman编号/比例尺，统一物理视场；二进制图片尚未写入仓库。图调用采用存在性判断，避免缺图导致编译中断。图片目标路径为project/figures/figure-02-corrosion-sem.png。随对话交付的完整工程与PDF包含该图。\n')
          PY
      - name: Compile revised Ca text
        id: ca
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Ca/mg-la-ni-ca-ijhe-zh-2026/project
          latexmk_use_xelatex: true
          texlive_version: 2026
          os: debian
      - name: Save the revised manuscript and remove the temporary helper
        shell: bash
        run: |
          set -euo pipefail
          cp Ca/mg-la-ni-ca-ijhe-zh-2026/project/main.pdf pdf/Ca.pdf
          rm .github/workflows/prepare-ca-sem-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ca/mg-la-ni-ca-ijhe-zh-2026/main.tex Ca/mg-la-ni-ca-ijhe-zh-2026/project/main.tex Ca/mg-la-ni-ca-ijhe-zh-2026/logs/change_log.md pdf/Ca.pdf .github/workflows/prepare-ca-sem-assets.yml
          git commit -m 'Add 24 h corrosion SEM description to Ca manuscript [skip ci]'
          git push origin HEAD:main
