name: Sync verified Ca Figure 2
on:
  push:
    paths:
      - '.github/workflows/sync-ca-figure2-once.yml'
permissions:
  contents: write
jobs:
  install-ca-fig2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify original SEM montage
        shell: bash
        env:
          FIGURE_URL: "https://sdmntprcacentral.oaiusercontent.com/files/00000000-e6a4-820d-8597-8f5e70644028/raw?se=2026-10-22T14%3A44%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=417e4897-171b-5284-90c3-a98ac90c737c&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T07%3A38%3A12Z&ske=2026-10-23T07%3A38%3A12Z&sks=b&skv=2026-02-06&sig=mpFKtxn3oCVPaF/6uCEoeZVyxbvO8bIAZF1/cU1ZftA%3D"
        run: |
          set -euo pipefail
          target="Ca/mg-la-ni-ca-ijhe-zh-2026/project/figures/figure-01.png"
          curl -fsSL --retry 3 --retry-delay 2 "$FIGURE_URL" -o "$target"
          echo "495ba558175fb7146bcf05f4e5a3491f00e86b0d01dd6ebbdfff10c16a5073b0  $target" | sha256sum --check
          test "$(stat -c%s "$target")" -eq 8122295
          echo "Verified original SEM figure: 8,122,295 bytes."
      - name: Commit Figure 2 image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Ca/mg-la-ni-ca-ijhe-zh-2026/project/figures/figure-01.png
          if git diff --cached --quiet; then
            echo 'Ca Figure 2 already matches the verified source.'
          else
            git commit -m 'Replace Ca Fig 2 with verified original SEM TIFF montage [skip ci]'
            git push origin HEAD:main
          fi
